<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Segoe UI, Arial, sans-serif">
  <!-- Fondo -->
  <rect width="1400" height="900" fill="#f8fafc"/>
  
  <!-- Título -->
  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">Diagrama ER - Centimo Back API</text>
  
  <!-- PLATAFORMA -->
  <g transform="translate(50, 80)">
    <rect width="240" height="260" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="240" height="36" rx="8" fill="#3b82f6"/>
    <rect x="0" y="28" width="240" height="8" fill="#3b82f6"/>
    <text x="120" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">PLATAFORMA</text>
    <text x="12" y="56" font-size="11" fill="#64748b">PK</text>
    <text x="40" y="56" font-size="11" fill="#1e293b" font-weight="bold">id</text>
    <text x="130" y="56" font-size="10" fill="#94a3b8">VARCHAR(50)</text>
    <line x1="10" y1="64" x2="230" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="80" font-size="11" fill="#1e293b">nombre</text>
    <text x="130" y="80" font-size="10" fill="#94a3b8">VARCHAR(100)</text>
    <text x="12" y="96" font-size="11" fill="#1e293b">tipo</text>
    <text x="130" y="96" font-size="10" fill="#94a3b8">VARCHAR(20)</text>
    <text x="12" y="112" font-size="11" fill="#1e293b">color</text>
    <text x="130" y="112" font-size="10" fill="#94a3b8">VARCHAR(7)</text>
    <text x="12" y="128" font-size="11" fill="#1e293b">icono</text>
    <text x="130" y="128" font-size="10" fill="#94a3b8">VARCHAR(50)</text>
    <text x="12" y="144" font-size="11" fill="#1e293b">orden</text>
    <text x="130" y="144" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="12" y="160" font-size="11" fill="#1e293b">notas_fijas</text>
    <text x="130" y="160" font-size="10" fill="#94a3b8">TEXT</text>
    <line x1="10" y1="168" x2="230" y2="168" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="184" font-size="10" fill="#94a3b8">fecha_creacion</text>
    <text x="12" y="200" font-size="10" fill="#94a3b8">fecha_actualizacion</text>
  </g>
  
  <!-- CUENTA -->
  <g transform="translate(50, 380)">
    <rect width="240" height="240" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect width="240" height="36" rx="8" fill="#10b981"/>
    <rect x="0" y="28" width="240" height="8" fill="#10b981"/>
    <text x="120" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">CUENTA</text>
    <text x="12" y="56" font-size="11" fill="#64748b">PK</text>
    <text x="40" y="56" font-size="11" fill="#1e293b" font-weight="bold">id</text>
    <text x="130" y="56" font-size="10" fill="#94a3b8">VARCHAR(50)</text>
    <line x1="10" y1="64" x2="230" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="80" font-size="11" fill="#64748b">FK</text>
    <text x="40" y="80" font-size="11" fill="#1e293b" font-weight="bold">plataforma_id</text>
    <text x="130" y="80" font-size="10" fill="#94a3b8">VARCHAR(50)</text>
    <text x="12" y="96" font-size="11" fill="#1e293b">nombre</text>
    <text x="130" y="96" font-size="10" fill="#94a3b8">VARCHAR(100)</text>
    <text x="12" y="112" font-size="11" fill="#1e293b">tipo</text>
    <text x="130" y="112" font-size="10" fill="#94a3b8">VARCHAR(20)</text>
    <text x="12" y="128" font-size="11" fill="#1e293b">moneda</text>
    <text x="130" y="128" font-size="10" fill="#94a3b8">VARCHAR(3)</text>
    <text x="12" y="144" font-size="11" fill="#1e293b">orden</text>
    <text x="130" y="144" font-size="10" fill="#94a3b8">INTEGER</text>
    <line x1="10" y1="152" x2="230" y2="152" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="168" font-size="10" fill="#94a3b8">fecha_creacion</text>
    <text x="12" y="184" font-size="10" fill="#94a3b8">fecha_actualizacion</text>
  </g>
  
  <!-- ASIGNACION SALARIO -->
  <g transform="translate(50, 660)">
    <rect width="240" height="240" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect width="240" height="36" rx="8" fill="#f59e0b"/>
    <rect x="0" y="28" width="240" height="8" fill="#f59e0b"/>
    <text x="120" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">ASIGNACION_SALARIO</text>
    <text x="12" y="56" font-size="11" fill="#64748b">PK</text>
    <text x="40" y="56" font-size="11" fill="#1e293b" font-weight="bold">id</text>
    <text x="130" y="56" font-size="10" fill="#94a3b8">VARCHAR(50)</text>
    <line x1="10" y1="64" x2="230" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="80" font-size="11" fill="#1e293b">anio</text>
    <text x="130" y="80" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="12" y="96" font-size="11" fill="#1e293b">mes</text>
    <text x="130" y="96" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="12" y="112" font-size="11" fill="#64748b">FK</text>
    <text x="40" y="112" font-size="11" fill="#1e293b" font-weight="bold">plataforma_id</text>
    <text x="130" y="112" font-size="10" fill="#94a3b8">VARCHAR(50)</text>
    <text x="12" y="128" font-size="11" fill="#1e293b">tipo</text>
    <text x="130" y="128" font-size="10" fill="#94a3b8">VARCHAR(20)</text>
    <text x="12" y="144" font-size="11" fill="#1e293b">valor</text>
    <text x="130" y="144" font-size="10" fill="#94a3b8">NUMERIC(10,2)</text>
    <text x="12" y="160" font-size="11" fill="#1e293b">nota</text>
    <text x="130" y="160" font-size="10" fill="#94a3b8">TEXT</text>
    <line x1="10" y1="168" x2="230" y2="168" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="184" font-size="10" fill="#94a3b8">fecha_creacion</text>
    <text x="12" y="200" font-size="10" fill="#94a3b8">fecha_actualizacion</text>
  </g>
  
  <!-- COMPROMISO -->
  <g transform="translate(750, 80)">
    <rect width="280" height="280" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect width="280" height="36" rx="8" fill="#ef4444"/>
    <rect x="0" y="28" width="280" height="8" fill="#ef4444"/>
    <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">COMPROMISO</text>
    <text x="12" y="56" font-size="11" fill="#64748b">PK</text>
    <text x="40" y="56" font-size="11" fill="#1e293b" font-weight="bold">id</text>
    <text x="150" y="56" font-size="10" fill="#94a3b8">VARCHAR(50)</text>
    <line x1="10" y1="64" x2="270" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="80" font-size="11" fill="#1e293b">descripcion</text>
    <text x="150" y="80" font-size="10" fill="#94a3b8">VARCHAR(200)</text>
    <text x="12" y="96" font-size="11" fill="#1e293b">mes</text>
    <text x="150" y="96" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="12" y="112" font-size="11" fill="#1e293b">anio</text>
    <text x="150" y="112" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="12" y="128" font-size="11" fill="#1e293b">tipo</text>
    <text x="150" y="128" font-size="10" fill="#94a3b8">VARCHAR(20)</text>
    <text x="12" y="144" font-size="11" fill="#1e293b">categoria</text>
    <text x="150" y="144" font-size="10" fill="#94a3b8">VARCHAR(50)</text>
    <text x="12" y="160" font-size="11" fill="#1e293b">cantidad</text>
    <text x="150" y="160" font-size="10" fill="#94a3b8">NUMERIC(10,2)</text>
    <text x="12" y="176" font-size="11" fill="#1e293b">es_estimado</text>
    <text x="150" y="176" font-size="10" fill="#94a3b8">BOOLEAN</text>
    <line x1="10" y1="184" x2="270" y2="184" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="200" font-size="10" fill="#94a3b8">fecha_creacion</text>
    <text x="12" y="216" font-size="10" fill="#94a3b8">fecha_actualizacion</text>
  </g>
  
  <!-- ALERTA -->
  <g transform="translate(750, 420)">
    <rect width="280" height="220" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="280" height="36" rx="8" fill="#8b5cf6"/>
    <rect x="0" y="28" width="280" height="8" fill="#8b5cf6"/>
    <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">ALERTA</text>
    <text x="12" y="56" font-size="11" fill="#64748b">PK</text>
    <text x="40" y="56" font-size="11" fill="#1e293b" font-weight="bold">id</text>
    <text x="150" y="56" font-size="10" fill="#94a3b8">VARCHAR(50)</text>
    <line x1="10" y1="64" x2="270" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="80" font-size="11" fill="#1e293b">descripcion</text>
    <text x="150" y="80" font-size="10" fill="#94a3b8">VARCHAR(200)</text>
    <text x="12" y="96" font-size="11" fill="#1e293b">mes</text>
    <text x="150" y="96" font-size="10" fill="#94a3b8">INTEGER</text>
    <text x="12" y="112" font-size="11" fill="#1e293b">anio</text>
    <text x="150" y="112" font-size="10" fill="#94a3b8">INTEGER</text>
    <line x1="10" y1="120" x2="270" y2="120" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="136" font-size="10" fill="#94a3b8">fecha_creacion</text>
    <text x="12" y="152" font-size="10" fill="#94a3b8">fecha_actualizacion</text>
  </g>
  
  <!-- RELACIONES -->
  <!-- Plataforma → Cuenta -->
  <line x1="290" y1="200" x2="290" y2="380" stroke="#334155" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="290,380 285,370 295,370" fill="#334155"/>
  <polygon points="290,210 285,220 295,220" fill="#334155"/>
  <text x="300" y="290" font-size="11" fill="#334155" font-weight="bold">1 : N</text>
  <text x="300" y="305" font-size="10" fill="#64748b">cascade ALL</text>
  
  <!-- Plataforma → AsignacionSalario -->
  <line x1="170" y1="340" x2="170" y2="660" stroke="#334155" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="170,660 165,650 175,650" fill="#334155"/>
  <polygon points="170,350 165,360 175,360" fill="#334155"/>
  <text x="180" y="500" font-size="11" fill="#334155" font-weight="bold">1 : N</text>
  
  <!-- ENUMS -->
  <g transform="translate(1100, 80)">
    <rect width="250" height="320" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="125" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">ENUMS</text>
    
    <text x="12" y="56" font-size="12" font-weight="bold" fill="#3b82f6">TipoPlataforma</text>
    <text x="20" y="72" font-size="11" fill="#64748b">banco, inversion, cripto,</text>
    <text x="20" y="88" font-size="11" fill="#64748b">p2p, crowdlending</text>
    
    <text x="12" y="120" font-size="12" font-weight="bold" fill="#10b981">TipoCuenta</text>
    <text x="20" y="136" font-size="11" fill="#64748b">corriente, ahorro,</text>
    <text x="20" y="152" font-size="11" fill="#64748b">inversion, bolsillo</text>
    
    <text x="12" y="184" font-size="12" font-weight="bold" fill="#f59e0b">TipoAsignacion</text>
    <text x="20" y="200" font-size="11" fill="#64748b">fijo, porcentaje</text>
    
    <text x="12" y="232" font-size="12" font-weight="bold" fill="#ef4444">TipoCompromiso</text>
    <text x="20" y="248" font-size="11" fill="#64748b">mensual, anual, unico</text>
    
    <text x="12" y="280" font-size="12" font-weight="bold" fill="#8b5cf6">CategoriaCompromiso</text>
    <text x="20" y="296" font-size="11" fill="#64748b">impuestos, suscripciones,</text>
    <text x="20" y="312" font-size="11" fill="#64748b">seguros, tramites, otros</text>
  </g>
  
  <!-- ENDPOINTS -->
  <g transform="translate(1100, 440)">
    <rect width="250" height="200" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="125" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">ENDPOINTS</text>
    
    <text x="12" y="56" font-size="11" fill="#3b82f6" font-weight="bold">/plataformas</text>
    <text x="12" y="72" font-size="10" fill="#64748b">GET, POST, PUT/{id}, DELETE/{id}</text>
    
    <text x="12" y="96" font-size="11" fill="#10b981" font-weight="bold">/cuentas</text>
    <text x="12" y="112" font-size="10" fill="#64748b">GET, POST, PUT/{id}, DELETE/{id}</text>
    
    <text x="12" y="136" font-size="11" fill="#f59e0b" font-weight="bold">/asignaciones-salario</text>
    <text x="12" y="152" font-size="10" fill="#64748b">GET, POST, PUT/{id}, DELETE/{id}</text>
    
    <text x="12" y="176" font-size="11" fill="#ef4444" font-weight="bold">/compromisos</text>
    <text x="12" y="192" font-size="10" fill="#64748b">GET, POST, PUT/{id}, DELETE/{id}</text>
  </g>
  
</svg>