spring.datasource.url=${URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.application.name=centimo-back-api

spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

# ════════════════════════════════════════════════════════════════
# Capa 2 — Seguridad (JWT + Spring Security + 2FA TOTP)
# ════════════════════════════════════════════════════════════════
# Usuario inicial (se crea solo si la tabla usuarios está vacía)
app.user.username=admin
# Si se omite app.user.password, se genera una al arrancar (ver logs)
app.user.password=Moneda2?
# Clave de firma de los JWT (HS256). Usa un valor >= 32 chars en producción.
# jwt.secret=
# Cifrado del secreto TOTP en BD (AES). Cambia ambos en producción.
# totp.master-key=change-me-in-prod-1234567890
# totp.salt=deadbeefdeadbeef

