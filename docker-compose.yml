services:
  postgres:
    image: postgres:16-alpine
    container_name: centimo-postgres
    environment:
      POSTGRES_DB: centimo
      POSTGRES_USER: centimo
      POSTGRES_PASSWORD: centimo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centimo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
